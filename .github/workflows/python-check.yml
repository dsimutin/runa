name: Python check

on:
  pull_request:
  push:
    branches:
      - main
      - prod/upgrade

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile app.py bot.py database.py neon_persistence.py runes_data.py runes_interpretations.py rasklad_engine.py product_runtime.py product_runtime_final.py human_reading.py support_requests.py rune_states.py rune_decks_approved.py spread_engine_approved.py

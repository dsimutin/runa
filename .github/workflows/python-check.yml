name: Python check

on:
  pull_request:
  push:
    branches:
      - main
      - prod/upgrade

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile bot.py database.py runes_data.py runes_interpretations.py rasklad_engine.py

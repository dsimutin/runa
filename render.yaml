services:
  - type: web
    name: runa-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: WEBHOOK_URL=${RENDER_EXTERNAL_URL} WEBHOOK_PATH=webhook python product_runtime_final.py
    envVars:
      - key: USE_GPT
        value: false
      - key: OPENAI_MODEL
        value: gpt-3.5-turbo
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_PATH
        value: webhook
      - key: DATABASE_URL
        sync: false

services:
  # ── Rune oracle bot (existing) ───────────────────────────────────────────────
  - type: web
    name: runa-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: WEBHOOK_URL=${RENDER_EXTERNAL_URL} WEBHOOK_PATH=webhook python product_runtime_final.py
    envVars:
      - key: USE_GPT
        value: false
      - key: OPENAI_MODEL
        value: gpt-3.5-turbo
      - key: DB_PATH
        value: rune_bot.db
      - key: PORT
        value: "10000"
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_PATH
        value: webhook

  # ── Symptom triage bot (@healthyz_bot) ──────────────────────────────────────
  - type: web
    name: symptom-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python symptom_bot.py
    envVars:
      - key: SYMPTOM_BOT_TOKEN
        value: "8612652867:AAFaoodd22CDIxGidaHHLOH7sZbXf6kjrb8"
      - key: SYMPTOM_ADMIN_CHAT_ID
        value: "352086154"
      - key: SYMPTOM_ADMIN_USERNAME
        value: "@healthyz_admin"
      - key: SYMPTOM_DB_PATH
        value: symptom_bot.db
      - key: PORT
        value: "10001"
      # Set this to the Render service URL after first deploy, e.g.:
      # https://symptom-bot.onrender.com
      - key: SYMPTOM_WEBHOOK_URL
        sync: false
      # Paste the full service-account JSON as one line:
      - key: GOOGLE_CREDS_JSON
        sync: false

services:
  - type: web
    name: runa-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: USE_GPT
        value: false
      - key: OPENAI_MODEL
        value: gpt-3.5-turbo
      - key: DB_PATH
        value: rune_bot.db
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
